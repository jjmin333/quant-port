    healthcheck:
      disable: true
    deploy: *worker-deploy

  # 공시 기반 적재 — 내부자 거래(DART 소유보고 · SEC Form 4).
  # 해외 07:00 · 국내 20:00 KST. 시각을 실적 배치(06:00 · 18:30)와 벌려 둔 것은
  # 같은 시각에 두 워커가 네트워크·DB를 두고 겹치지 않게 하기 위해서다.
  worker-filings:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: quant-port-worker-filings
    command: ["./worker-filings"]
    restart: unless-stopped
    env_file:
      - ./be/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      MYSQL_DSN: ${MYSQL_DSN:-quantport:quantport@tcp(host.docker.internal:3306)/quantport?parseTime=true&charset=utf8mb4&loc=Asia%2FSeoul}
      # 워커는 잡을 하나씩 순차로 돌린다(배치 코드에 동시성 풀이 없다). 그런데
      # repository.NewMySQL의 기본값은 API 기준인 50이라, 이 컨테이너 8개가
      # 그대로 뜨면 워커만으로 최대 400 커넥션을 연다 — MySQL 기본
      # max_connections는 151이다. 재배포처럼 9개 프로세스가 동시에 기동하는
      # 순간 커넥션이 고갈돼 전부 기동에 실패한다.
      #
      # 8이면 트랜잭션 하나(커넥션 1개 점유)에 여유를 더한 값이고,
      # 8×8=64 + API 50 = 114로 기본 한도 안에 들어온다.
      MYSQL_MAX_OPEN_CONNS: "8"
      MYSQL_MAX_IDLE_CONNS: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      # 마이그레이터는 api 하나뿐이다. 워커는 api가 healthy가 된 뒤에야 뜬다 —
      # /health가 응답한다는 것은 server.New()가 EnsureSchema를 끝냈다는 뜻이다.
      # (워커 쪽 코드도 repository.VerifySchema로 스키마를 기다리므로, 기동
      # 순서를 보장하기 어려운 환경에서도 안전하다.)
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy: *worker-deploy

  # ---- 배포 토폴로지 (프로파일 prod) ------------------------------------
  # 기본 `docker compose up -d`와 be/scripts/restart.ps1은 이 둘을 띄우지 않는다.
  # 평소 개발은 `npm run dev`로 FE를 돌리는 흐름 그대로다.
  #
  #   docker compose --profile prod up -d --build
  #
  # 이 구성이 필요한 이유는 성능이 아니라 보안이다 — Next의 rewrite가 클라이언트
  # X-Forwarded-For를 그대로 BE에 넘겨 IP 레이트 리밋이 우회됐다(실측: XFF 회전
  # 150 동시 요청 중 150건 통과). nginx가 XFF를 자신이 관찰한 주소로 덮어써서
  # 그 구멍을 닫는다. 자세한 내용은 deploy/nginx/nginx.conf 머리말.

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: quant-port-fe
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      # 서버 컴포넌트(SSR)가 BE를 직접 부를 때 쓰는 주소. 브라우저는 이 값을
      # 쓰지 않는다 — getApiBaseUrl()이 브라우저에서 ""를 반환해 nginx와 같은
      # 오리진으로 나간다.
      NEXT_PUBLIC_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 64M

  nginx:
    image: nginx:1.27-alpine
    container_name: quant-port-nginx
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      # 로컬에서 80은 다른 것이 쓰고 있을 수 있어 8088로 뺀다.
      # 실제 배포에서는 80:80 / 443:443으로 바꾼다.
      - "8088:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 공통 프록시 헤더. location마다 include 해야 한다 — proxy_set_header는
      # 상속이 replace라, location이 자기 것을 선언하면 상위 것이 사라진다.
      - ./deploy/nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    depends_on:
      api:
        condition: service_healthy
      fe:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M

volumes:
  quant_port_redis_data:
  quant_port_media:
