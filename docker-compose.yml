  # ---- 배포 토폴로지 (프로파일 prod) ------------------------------------
  # 기본 `docker compose up -d`와 be/scripts/restart.ps1은 이 둘을 띄우지 않는다.
  # 평소 개발은 `npm run dev`로 FE를 돌리는 흐름 그대로다.
  #
  #   docker compose --profile prod up -d --build
  #
  # 이 구성이 필요한 이유는 성능이 아니라 보안이다 — Next의 rewrite가 클라이언트
  # X-Forwarded-For를 그대로 BE에 넘겨 IP 레이트 리밋이 우회됐다(실측: XFF 회전
  # 150 동시 요청 중 150건 통과). nginx가 XFF를 자신이 관찰한 주소로 덮어써서
  # 그 구멍을 닫는다. 자세한 내용은 deploy/nginx/nginx.conf 머리말.

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: quant-port-fe
    profiles: ["prod"]
    restart: unless-stopped
    logging: *logging
    cpu_shares: 1024
    stop_grace_period: 20s
    environment:
      # 서버 컴포넌트(SSR)가 BE를 직접 부를 때 쓰는 주소. 브라우저는 이 값을
      # 쓰지 않는다 — getApiBaseUrl()이 브라우저에서 ""를 반환해 nginx와 같은
      # 오리진으로 나간다.
      NEXT_PUBLIC_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      # 이미지에 curl·wget이 없다(slim) — Node 자체로 찌른다. standalone 서버가
      # 멈춰 있어도(행업) 컨테이너 프로세스는 살아 있을 수 있어, "떠 있음"과
      # "응답함"을 나눠 보지 않으면 nginx가 죽은 백엔드로 계속 트래픽을 보낸다.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 64M

  nginx:
    image: nginx:1.27-alpine
    container_name: quant-port-nginx
    profiles: ["prod"]
    restart: unless-stopped
    logging: *logging
    cpu_shares: 1024
    stop_grace_period: 20s
    extra_hosts:
      # app_routes.host-fe.conf → 호스트 npm run dev (:3000)
      - "host.docker.internal:host-gateway"
    ports:
      # 로컬에서 80은 다른 것이 쓰고 있을 수 있어 8088로 뺀다.
      # 도메인 연결 시 리포 루트 .env 에 NGINX_HTTP_PORT=80 · NGINX_HTTPS_PORT=443.
      # OCI 오버레이는 443 만 추가한다(80 은 base 의 NGINX_HTTP_PORT).
      #
      # **변수로 두는 이유**: compose 의 ports 는 오버레이에서 "치환"이 아니라
      # "추가"로 병합된다. 오버레이에 80:80 을 적으면 base 의 8088:80 이 그대로
      # 남아서, 배포 VM 이 의도치 않게 8088 을 0.0.0.0 에 연다.
      - "${NGINX_HTTP_PORT:-8088}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # nginx.conf(평문) · nginx.dual.conf(80+443→FE) · nginx.tls.conf(운영 TLS)
      - ./deploy/nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      # app_routes.conf(fe:3000) · app_routes.host-fe.conf(host:3000)
      - ./deploy/nginx/${NGINX_ROUTES:-app_routes.conf}:/etc/nginx/app_routes.conf:ro
      # 스캐너 노이즈 차단(wp-admin · .php · .zip …). app_routes 두 벌이 함께 쓴다.
      - ./deploy/nginx/block_noise.conf:/etc/nginx/block_noise.conf:ro
      - ./deploy/nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./deploy/nginx/proxy_headers_fe.conf:/etc/nginx/proxy_headers_fe.conf:ro
      # nginx.dual.conf / nginx.tls.conf 용. 없으면 start-domain.ps1 이 자체 서명 생성.
      - ${NGINX_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      # host-fe 모드에서는 Docker fe 를 띄우지 않는다.
      fe:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M

volumes:
  quant_port_redis_data:
  # 번역 모델 캐시. named volume이라 컨테이너를 지웠다 다시 만들어도 470MB를
  # 다시 받지 않는다.
  quant_port_llama_models:
  quant_port_media:
