# 이 파일은 **한 대에 다 띄우는 구성**(로컬 개발 · 단일 VM)이다.
# 클라우드에서 API VM과 배치 VM을 나눠 쓸 때는 다음을 쓴다:
#   API/FE VM : docker-compose.yml + deploy/compose/docker-compose.app.oci.yml
#               → deploy/scripts/app-stack.sh
#   배치 VM   : deploy/compose/docker-compose.batch.yml (단독 파일)
#               → deploy/scripts/batch-stack.sh
# 배경과 근거는 docs/OCI_MIGRATION_PLAN.md.

# 로그 상한 — **없으면 무제한이다.**
#
# json-file 드라이버의 기본값은 크기 제한이 없다. 요청마다 한 줄씩 쌓이고
# (middleware.Logger + nginx access_log), 부트 볼륨은 50 GiB다. 디스크가 차면
# Docker도 앱도 함께 멈추고, 그때는 SSH가 살아 있어야만 복구할 수 있다.
#
# 10m×3 = 컨테이너당 최대 30 MB, 12컨테이너에 360 MB로 고정된다.
# 호스트의 /etc/docker/daemon.json 에도 같은 기본값을 두는 것이 좋지만(새 컨테이너
# 까지 덮으므로), 그건 리포에 안 들어오는 설정이라 여기서 한 번 더 못박는다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 리소스 리밋 — 한 컨테이너가 호스트를 잠식하지 못하게 한다.
#
# 값은 실측 사용량 기준으로 넉넉히 잡았다(워커 peak 14MB → 256M, 18배).
# 좁게 잡으면 OOM kill이 배치를 조용히 죽이는 쪽이 더 위험하다.
x-worker-deploy: &worker-deploy
  resources:
    limits:
      cpus: "0.50"
      memory: 256M
    reservations:
      memory: 32M

# 워커 8개 공통 런타임. 각 서비스에서 `<<: *worker-runtime` 으로 병합한다.
# (서비스에 같은 키를 직접 쓰면 그쪽이 이긴다 — 기존 블록의 restart/healthcheck/
#  extra_hosts 는 그대로 유효하다.)
# 여러 역할을 묶은 워커(2026-10-01, 9→4 컨테이너) — 예전 상한 0.5 CPU·256M을 역할 수만큼 합친 것보다 작게.
x-worker-deploy-wide: &worker-deploy-wide
  resources:
    limits:
      cpus: "1.00"
      memory: 512M
    reservations:
      memory: 48M

x-worker-runtime: &worker-runtime
  logging: *logging
  # CPU 가중치 — **상한이 아니라 경합 시의 배분율**이다.
  #
  # 현재 컨테이너 CPU 상한의 합은 8.5인데 운영 VM은 2 OCPU다. 상한만 있으면 경합할 때
  # CFS가 균등 분배해서, 워커 넷이 동시에 돌면 api가 1/5를 받는다. shares는 유휴일 때
  # 아무 영향이 없고 경합할 때만 비율을 바꾼다 — 성능과 안정성을 맞바꾸는 튜닝이 아니다.
  #   api 2048 : fe/nginx/redis 1024 : worker 256  → 전면 경합 시 api가 워커의 8배
  cpu_shares: 256
  # 배치는 잡 실행 중일 수 있다. 기본 10초는 진행 중인 트랜잭션을 끊기에 짧다.
  # (그래도 2시간 타임아웃으로 중간에 끊길 수 있으므로 잡의 idempotency가 본체다.)
  stop_grace_period: 60s

services:
  redis:
    image: redis:7-alpine
    container_name: quant-port-redis
    restart: unless-stopped
    logging: *logging
    cpu_shares: 1024
    ports:
      # **loopback에만 게시한다.** 0.0.0.0에 열면 공개 IP를 가진 VM에서 인증 없는
      # Redis가 인터넷에 그대로 노출된다 — Docker는 published 포트를 iptables nat
      # 테이블의 DNAT로 처리해서, 호스트 방화벽(firewalld)만 잠가서는 못 막는
      # 구성이 흔하다. 컨테이너끼리는 compose 네트워크로 붙으므로 영향이 없고,
      # 호스트에서 redis-cli 로 붙는 것도 그대로 된다.
      #
      # 배치를 다른 VM에서 돌릴 때는 이 값을 사설 IP로 바꿔야 한다 — 그때는
      # requirepass 와 NSG 제한이 함께 와야 한다(deploy/compose/docker-compose.app.oci.yml).
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    # 상한이 없으면(maxmemory 0 + noeviction, 기본값) Redis는 계속 자라다가
    # 호스트를 OOM으로 몰거나, 메모리가 차는 순간 **쓰기가 전부 에러**가 된다.
    # AGENT_STATE가 "기동 시 Redis 필수"로 못박고 있어 파급이 크다.
    #
    # 정책이 volatile-lru인 이유: TTL이 걸린 키만 버린다. 실측으로 TTL 없는 키는
    # `md:rev:<symbol>` 2,204개(각 56B, 합계 약 123KB)뿐인데, 이건 캐시 무효화용
    # INCR 카운터라 사라지면 리비전이 되감겨 낡은 캐시가 새 것으로 보인다.
    # allkeys-lru는 이걸 버릴 수 있고, volatile-lru는 정확히 이것만 보호한다.
    # 나머지(23,719키 중 21,515개)는 전부 TTL이 있어 축출 대상으로 충분하다.
    #
    # 기본 1gb는 현재 사용량 338MB·피크 482MB의 2배 이상이라 **지금은 아무것도
    # 축출되지 않는다** — 상한을 두는 것이 목적이지 캐시를 줄이는 게 아니다.
    # 클라우드에서는 인스턴스 RAM의 60~70%로 REDIS_MAXMEMORY를 넘겨 조절한다.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - quant_port_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 128M

  # BE API + Tesseract OCR — 로컬·클라우드 공통 이미지
  api:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: quant-port-api
    restart: unless-stopped
    logging: *logging
    cpu_shares: 2048
    # in-flight 요청을 비우고 배경 폴러 13개를 정리하는 데 기본 10초는 빠듯하다.
    # (Server.Shutdown 이 "HTTP 배수 → 배경 취소 → 풀 종료" 순서로 돈다.)
    stop_grace_period: 30s
    ports:
      # loopback 전용 — 이유는 redis 쪽 주석과 같고, 하나 더 있다.
      # nginx 가 X-Forwarded-For 를 자기가 관찰한 주소로 덮어써서 IP 레이트 리밋의
      # 근거를 만드는데, :8080 에 직접 붙을 수 있으면 그 덮어쓰기를 통째로 우회한다
      # (실측: XFF 를 회전시킨 150 요청이 전부 통과했다). /metrics 도 여기로 샌다.
      - "127.0.0.1:8080:8080"
    env_file:
      - ./be/.env
    environment:
      REDIS_URL: ${REDIS_URL_CONTAINER:-redis://redis:6379/0}
      IMPORT_TEMP_DIR: /var/lib/quant-port/import
      MEDIA_DIR: /var/lib/quant-port/media
      # Go GC 에게 컨테이너 상한을 알려 준다. 이게 없으면 GC 는 호스트 메모리를 보고
      # 판단하다가 cgroup 상한(1 GiB)에 부딪혀 **OOM 킬**을 당한다 — SIGKILL 이라
      # graceful shutdown 이 없고, 그러면 프로세스가 다시 뜨면서 Toss 토큰을
      # 재발급해 이전 토큰을 401 로 만든다(시세 적재가 끊긴다).
      # 800MiB = 상한의 80%. 나머지 200MiB 는 Go 런타임 밖(스택·OCR 자식 프로세스) 몫.
      GOMEMLIMIT: "800MiB"
      # 동시에 도는 tesseract 수. 비워 두면 GOMAXPROCS(= 이 컨테이너의 코어 수)를 쓴다.
      # 0 이면 상한 해제(롤백용). 근거는 be/internal/import/ocr/limit.go.
      OCR_MAX_CONCURRENCY: "${OCR_MAX_CONCURRENCY:-}"
      MYSQL_DSN: ${MYSQL_DSN:-quantport:quantport@tcp(host.docker.internal:3306)/quantport?parseTime=true&charset=utf8mb4&loc=Asia%2FSeoul}
      # 관리자 「배치 관리」에서 고친 시간표가 리포 파일과 한 벌이 되게.
      BATCH_SCHEDULE_PATH: /app/docs/BATCH_SCHEDULE.md
      # 로고 매니페스트. **없으면 BE는 모든 종목에 FMP 원격 URL을 내려보낸다** —
      # LoadManifest는 파일이 없을 때 조용히 넘어가고(os.IsNotExist → nil), 그러면
      # 리졸버가 로컬 파일을 하나도 못 쓴다. 실측으로 삼성전자까지 원격이었다.
      LOGO_MANIFEST_PATH: /app/logos/manifest.json
      # 해외 뉴스 제목 EN→KO — **Azure AI Translator**(2026-09-11 사용자 결정).
      #
      # 자체 모델(translator 컨테이너)에서 옮겨 왔다. 그 컨테이너는 아래에서
      # `legacy-translator` 프로파일로 내려가 기본 기동에서 빠진다 — 되돌리려면
      # TRANSLATE_PROVIDER=local 로 바꾸고 그 프로파일로 올린다.
      #
      # **키가 없으면 번역이 아예 안 된다**(폴백 없음): 해외 제목이 영어로 남고
      # 기동 로그가 그 사실을 찍는다.
      #
      # AZURE_TRANSLATOR_* 는 **여기 적지 않는다.** 다른 비밀값과 똑같이
      # `env_file: ./be/.env`로 들어온다 — FINNHUB_NEWS_API_KEY도 그렇다.
      # 예전에는 여기에 `"${AZURE_TRANSLATOR_KEY:-}"` 세 줄이 있었는데, compose에서
      # `environment`는 `env_file`을 **이긴다.** 그래서 be/.env에 키를 적어도 컨테이너
      # 안에서는 빈 문자열이 됐고, 키 없는 엔진은 조용히 사슬에서 빠지므로 아무 오류
      # 없이 번역만 0건이 됐다(2026-09-13 실측 `engines=local`).
      TRANSLATE_PROVIDER: "${TRANSLATE_PROVIDER:-azure}"
      TRANSLATE_LOCAL_URL: "${TRANSLATE_LOCAL_URL:-http://translator:8100}"
      # HTTP·실시간 루프만. 배치(LLM 9개)는 worker-content(SERVER_ROLE=batch)가 돈다.
      SERVER_ROLE: "api"
    volumes:
      # 사용자 업로드 이미지(리포트 본문 등)는 **영구 보관**이라 named volume이어야
      # 한다 — writable layer에 두면 재기동(recreate)마다 지워진다.
      - quant_port_media:/var/lib/quant-port/media
      - ./be/docs/BATCH_SCHEDULE.md:/app/docs/BATCH_SCHEDULE.md
      # 매니페스트는 FE가 만들어 FE 쪽에 사는 파일이다(migrate-logos의 -out).
      # 이미지에 굽지 않고 읽기 전용으로 걸어, 로고를 새로 받아도 API를 다시
      # 빌드하지 않고 재기동만 하면 되게 한다.
      - ./fe/public/logos/manifest.json:/app/logos/manifest.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      # 번역기는 **없어도 API가 뜬다**(started, healthy가 아니다). 2026-09-11에
      # Azure로 옮긴 뒤로는 이 컨테이너가 기본 기동에서 빠지므로(profiles) 이
      # 의존성은 거의 언제나 「없음」으로 풀린다 — required:false가 그걸 받는다.
      translator:
        condition: service_started
        required: false
    # import temp: 컨테이너 writable layer (디스크). job 완료 시 코드에서 RemoveAll.
    # tmpfs 미사용 — RAM 점유·256MB 상한 OOM 리스크 회피 (스크린샷 10장 peak ~수십 MB).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 128M

  # ---- 번역기 -----------------------------------------------------------
  #
  # 해외 뉴스 **제목**을 EN→KO로 옮긴다. Papago(NCP 글자 과금)를 대신하는 자체 모델로,
  # 근거와 모델 선정 과정은 be/docs/TRANSLATION_SELFHOST.md에 있다.
  #
  # **별도 컨테이너인 이유**는 격리다. 모델을 올리는 데 수십 초가 걸리고 추론이 CPU를
  # 통째로 쓰는데, 이게 API 프로세스 안에 있으면 번역 한 번이 시세 응답을 밀어낸다.
  # 여기 있으면 이상할 때 `docker compose restart translator` 하나로 끝나고, 그동안
  # API는 폴백(Papago)으로 계속 번역한다.
  #
  # llama.cpp 서버를 **그대로** 쓴다 — 우리 래퍼를 하나 더 만들지 않는다. 이 이미지는
  # OpenAI 호환 `/v1/chat/completions`를 내므로, 나중에 엔진을 vLLM·Ollama 무엇으로
  # 바꿔도 Go 쪽은 URL만 바뀐다.
  #
  # # 기본 기동에서 빠졌다 (2026-09-11 사용자 결정)
  #
  # 해외 제목 번역은 Azure AI Translator로 옮겼다 — 이유는 `be/internal/translate/azure.go`
  # 머리글에 있다(제목 한 건에 0.9~2.8초, 상시 1.5코어·2GB, 모델 적재 중에는 그 주기가
  # 통째로 영어로 남음). 정의를 **지우지 않고** 프로파일로 내린 이유는 되돌리는 길을
  # 한 줄로 남겨 두기 위해서다:
  #
  #     TRANSLATE_PROVIDER=local docker compose --profile legacy-translator up -d translator api
  #
  # Azure 쪽이 며칠 안정적으로 돌면 이 블록과 quant_port_llama_models 볼륨을 지운다.
  translator:
    # **CPU 전용에서 CUDA로 옮겼다 (2026-09-15).** 이 컨테이너를 내렸던 이유 셋은
    # 전부 「CPU 전용」이라는 전제에서 나온 것이었다(azure.go 머리글: 제목 한 건
    # 0.9~2.8초 · 상시 1.5코어 · 모델 적재 중 그 주기가 통째로 영어). 이 기계에는
    # RTX 4070(12GB)이 있고 Docker Desktop이 nvidia 런타임을 이미 갖고 있다
    # (`docker info`의 Runtimes에 nvidia가 있다). 전제가 바뀌면 결론도 바뀐다.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: quant-port-translator
    profiles: ["legacy-translator"]
    restart: unless-stopped
    logging: *logging
    # API·워커보다 낮게 둔다. 번역은 배치라 늦어도 되고, 늦어서 잃는 것이 없다.
    # GPU로 옮긴 뒤로 이 컨테이너의 CPU는 토큰을 만드는 자리가 아니라 요청을
    # 받아 넘기는 자리다 — 경합 자체가 거의 없다.
    cpu_shares: 512
    stop_grace_period: 15s
    ports:
      # loopback 전용. 컨테이너끼리는 compose 네트워크로 붙으므로 이 포트는
      # 사람이 직접 재볼 때(cmd/compare-translation)만 쓴다.
      - "127.0.0.1:8100:8100"
    # 모델은 **첫 기동 때 HF에서 받아** 볼륨에 캐시한다. 이미지에 굽지 않는 이유는
    # 모델을 바꾸는 일이 이미지를 다시 만드는 일이 되지 않게 하기 위해서다 —
    # TRANSLATE_MODEL만 바꾸고 재기동하면 된다.
    command: >
      -hf ${TRANSLATE_MODEL:-mradermacher/LMT-60-4B-GGUF:Q8_0}
      --host 0.0.0.0 --port 8100
      -ngl ${TRANSLATE_NGL:-99}
      --ctx-size ${TRANSLATE_CTX:-4096}
      --parallel ${TRANSLATE_SLOTS:-4}
      --threads ${TRANSLATE_THREADS:-4}
      --no-webui
    volumes:
      # **`/root/.cache/llama.cpp`가 아니라 `/root/.cache`다 (2026-09-15).**
      # 요즘 llama.cpp의 `-hf`는 모델을 HF 캐시 규약(`/root/.cache/huggingface/hub`)에
      # 받는다. 예전 경로에 볼륨을 걸면 **마운트 밖으로 받아지고**, 컨테이너를 다시
      # 만들 때마다 4.3GB를 또 내려받는다(실측: 볼륨은 비어 있는데 컨테이너 안에는
      # 받다 만 파일이 있었다). 캐시 뿌리를 통째로 걸면 경로가 또 바뀌어도 안 깨진다.
      - quant_port_llama_models:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8100/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 첫 기동은 모델을 내려받는다(4B Q8_0 ≈ 4.3GB). 넉넉히 준다.
      start_period: 900s
    deploy:
      resources:
        limits:
          # **1.7B가 아니라 4B이고, Q4_K_M이 아니라 Q8_0이다 (2026-09-15).**
          # 1.7B로 올린 이유(0.6B가 회사 이름을 지어냈다)와 같은 축에서 한 칸 더
          # 간다 — 남은 실패도 낱말·고유명사였다. GPU에 전층을 얹으면 4B와 1.7B의
          # 지연 차이가 배치 기준으로 값이 아니고, VRAM 12GB에 Q8_0(약 4.3GB)이
          # 남아도는데 양자화 손실을 감수할 이유가 없다.
          #
          # 여기 cpus·memory는 이제 **추론이 아니라 여유**다. 예전 2G는 실측 RSS
          # 1.6GB에 여유가 0.4GB뿐이라 OOM 킬 → 재기동 → 모델 재적재(그동안 번역
          # 0건)의 가장 유력한 자리였다. 가중치는 GPU에 있고 호스트 쪽은 mmap
          # 페이지 캐시라 회수 가능하지만, 그 경계에 다시 붙지 않도록 넉넉히 둔다.
          #
          # **6G도 모자랐다 (실측 2026-09-16).** GPU에 전층을 올렸는데도 호스트
          # 쪽 `anon`이 6.2GB였다 — WSL2의 CUDA는 VRAM 할당을 호스트 익명
          # 메모리로 잡아 두고, 그건 페이지 캐시와 달리 **회수되지 않는다**.
          # 상한 6G에서 `memory.events`의 max가 100,937회였고(=계속 회수 압력)
          # VM이 스왑 3GB를 쓰며 드레인 속도가 6.8건/초 → 1.5건/초로 떨어졌다.
          # oom_kill은 아직 0이었지만 그건 운이다.
          #
          # VM이 15.9GB이고 나머지 컨테이너 열둘을 합쳐 300MB 남짓이라 10G는
          # 넉넉히 들어간다. 더 줄이고 싶으면 상한이 아니라 **양자화**를 낮춰라
          # (Q6_K 3.4GB · Q5_K_M 2.9GB) — 상한을 조이는 쪽은 죽는 쪽이다.
          cpus: "${TRANSLATE_CPUS:-3.0}"
          memory: ${TRANSLATE_MEMORY:-10G}
        reservations:
          memory: 128M
          # GPU 예약. compose가 이 블록을 nvidia 런타임으로 옮겨 준다 —
          # `docker run --gpus all`과 같은 뜻이고, swarm이 아니어도 동작한다.
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---- 뉴스 감성 분류기 ---------------------------------------------------
  #
  # 종목이 붙은 기사 제목에 감성(−1..1)을 매긴다. 한국어 snunlp/KR-FinBert-SC ·
  # 영어 ProsusAI/finbert(2026-09-23 사용자 결정) — 이유와 안전장치는 be/sentiment/app.py.
  # 이 라벨로 점수 배치가 **전 종목** 심리 축을 계산한다(예전에는 AI 요약이 다녀간
  # 종목에만 붙어 하루 9종목이었다).
  #
  # **CPU 전용이다.** 운영 이전 대상(OCI)에 GPU가 없다. 번역기와 달리 프로파일에
  # 숨기지 않는다 — 기본 기동에 들어간다. 없으면 라벨 배치가 건너뛰고 심리 축은
  # 「없음」으로 남을 뿐이다(틀린 값이 아니다).
  sentiment:
    build:
      context: ./be/sentiment
      dockerfile: Dockerfile
    container_name: quant-port-sentiment
    restart: unless-stopped
    logging: *logging
    # 배치가 부르는 자리라 늦어도 된다 — API·워커보다 낮게.
    cpu_shares: 512
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      # 모델 두 개(약 850MB)를 첫 기동 때 받아 둔다. 다시 만들어도 다시 받지 않는다.
      - quant_port_sentiment_models:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 첫 기동은 모델을 내려받는다.
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # BERT-base 두 개 ≈ 900MB + torch 런타임. 여유를 둔다.
          memory: 2G
        reservations:
          memory: 256M

  # ---- 배치 워커 --------------------------------------------------------
  # 2026-10-01 사용자 결정: 잡은 **성격별 컨테이너**로 묶는다(예전 9개 → 4개). 이미지는 api와 같고,
  # `./worker`가 WORKER_ROLES의 역할들을 한 프로세스에서 돌린다(be/cmd/worker). 역할 하나가 예전
  # 단독 워커 하나와 같은 일을 같은 방식으로 한다 — 부트스트랩과 종료 신호만 한 번으로 모았다.
  # LLM 배치 9개(종목 요약·뉴스 브리핑·실적 관전·스크리너 사전·Reddit 요약·리포트 검토)는 의존
  # 그래프가 api와 같아 api 바이너리를 SERVER_ROLE=batch로 띄운다(worker-content).
  # api 컨테이너는 HTTP와 실시간 루프만(SERVER_ROLE=api).

  # 시세·종가·지수 — KRX/US 종가 투영, 일봉 채우기, 지수 백필
  worker-market:
    # api가 빌드한 이미지 그대로(2026-10-02) — 서비스마다 build를 두면 이미지 태그가 따로라
    # API만 다시 빌드했을 때 워커가 옛 코드로 남았다(restart.ps1 -ApiOnly 뒤 --no-build 재생성).
    image: quant-port-api:latest
    pull_policy: never
    container_name: quant-port-worker-market
    <<: *worker-runtime
    command: ["./worker"]
    restart: unless-stopped
    env_file:
      - ./be/.env
    environment:
      WORKER_ROLES: "close-domestic,close-overseas,fetch,index"
      REDIS_URL: ${REDIS_URL_CONTAINER:-redis://redis:6379/0}
      MYSQL_DSN: ${MYSQL_DSN:-quantport:quantport@tcp(host.docker.internal:3306)/quantport?parseTime=true&charset=utf8mb4&loc=Asia%2FSeoul}
      # 역할 넷이 한 풀을 나눠 쓴다(예전 4×4=16 → 6). 잡은 대부분 순차라 동시 사용은 2~3.
      MYSQL_MAX_OPEN_CONNS: "6"
      MYSQL_MAX_IDLE_CONNS: "3"
      GOMEMLIMIT: "400MiB"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      # 마이그레이터는 api 하나뿐이다 — /health 는 EnsureSchema가 끝났다는 뜻.
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy: *worker-deploy-wide

  # 주식 데이터·점수·감시 — 점수/변화/감성/지수해설, 공시·재무·내부자·경고·수급·섹터·외부 신호,
  # 실적 일정, 리서치 판정, 검색 유입 감시(growth)
  worker-stock:
    # api가 빌드한 이미지 그대로(2026-10-02) — 서비스마다 build를 두면 이미지 태그가 따로라
    # API만 다시 빌드했을 때 워커가 옛 코드로 남았다(restart.ps1 -ApiOnly 뒤 --no-build 재생성).
    image: quant-port-api:latest
    pull_policy: never
    container_name: quant-port-worker-stock
    <<: *worker-runtime
    command: ["./worker"]
    restart: unless-stopped
    env_file:
      - ./be/.env
    environment:
      WORKER_ROLES: "scores,filings,earnings,research,growth"
      REDIS_URL: ${REDIS_URL_CONTAINER:-redis://redis:6379/0}
      MYSQL_DSN: ${MYSQL_DSN:-quantport:quantport@tcp(host.docker.internal:3306)/quantport?parseTime=true&charset=utf8mb4&loc=Asia%2FSeoul}
      MYSQL_MAX_OPEN_CONNS: "8"
      MYSQL_MAX_IDLE_CONNS: "4"
      GOMEMLIMIT: "400MiB"
      # 뉴스 감성(로컬 모델) — scores 역할.
      SENTIMENT_URL: ${SENTIMENT_URL:-http://sentiment:8200}
      # Reddit 인기 글 제목·앞부분 번역(social_posts, filings 역할) — api와 같은 엔진.
      TRANSLATE_PROVIDER: "${TRANSLATE_PROVIDER:-azure}"
      TRANSLATE_LOCAL_URL: "${TRANSLATE_LOCAL_URL:-http://translator:8100}"
      # growth 역할 — 서비스 계정 JSON은 be/secrets/에 둔다(깃·이미지 밖). 없으면 Google 소스는 「미설정」.
      GROWTH_GOOGLE_CREDENTIALS_FILE: /run/growth-secrets/google-service-account.json
      GROWTH_REPORT_DIR: /var/lib/quant-port/growth
      GROWTH_CRAWL_ORIGIN: http://nginx
    volumes:
      - ./be/secrets:/run/growth-secrets:ro
      - ./be/var/growth-reports:/var/lib/quant-port/growth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      # 분류기는 없어도 뜬다(required:false) — 감성 잡만 「분류기 없음」으로 건너뛴다.
      sentiment:
        condition: service_started
        required: false
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy: *worker-deploy-wide

  # 자산 — 부동산 실거래·지수·공매, 금리, 금융상품 + 그 점수·AI 해설(자산 전용 LLM 키)
  worker-asset:
    # api가 빌드한 이미지 그대로(2026-10-02) — 서비스마다 build를 두면 이미지 태그가 따로라
    # API만 다시 빌드했을 때 워커가 옛 코드로 남았다(restart.ps1 -ApiOnly 뒤 --no-build 재생성).
    image: quant-port-api:latest
    pull_policy: never
    container_name: quant-port-worker-asset
    <<: *worker-runtime
    command: ["./worker"]
    restart: unless-stopped
    env_file:
      - ./be/.env
    environment:
      WORKER_ROLES: "asset"
      REDIS_URL: ${REDIS_URL_CONTAINER:-redis://redis:6379/0}
      MYSQL_DSN: ${MYSQL_DSN:-quantport:quantport@tcp(host.docker.internal:3306)/quantport?parseTime=true&charset=utf8mb4&loc=Asia%2FSeoul}
      MYSQL_MAX_OPEN_CONNS: "4"
      MYSQL_MAX_IDLE_CONNS: "2"
      GOMEMLIMIT: "400MiB"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy: *worker-deploy-wide

  # AI 콘텐츠 — api 바이너리의 batch 역할(LLM 배치 9개). 실시간 루프·마이그레이션은 안 한다.
  worker-content:
    # api가 빌드한 이미지 그대로(2026-10-02) — 서비스마다 build를 두면 이미지 태그가 따로라
    # API만 다시 빌드했을 때 워커가 옛 코드로 남았다(restart.ps1 -ApiOnly 뒤 --no-build 재생성).
    image: quant-port-api:latest
    pull_policy: never
    container_name: quant-port-worker-content
    <<: *worker-runtime
    command: ["./api"]
    restart: unless-stopped
    env_file:
      - ./be/.env
    environment:
      SERVER_ROLE: "batch"
      REDIS_URL: ${REDIS_URL_CONTAINER:-redis://redis:6379/0}
      MYSQL_DSN: ${MYSQL_DSN:-quantport:quantport@tcp(host.docker.internal:3306)/quantport?parseTime=true&charset=utf8mb4&loc=Asia%2FSeoul}
      MYSQL_MAX_OPEN_CONNS: "8"
      MYSQL_MAX_IDLE_CONNS: "4"
      GOMEMLIMIT: "600MiB"
      LOGO_MANIFEST_PATH: /app/logos/manifest.json
      TRANSLATE_PROVIDER: "${TRANSLATE_PROVIDER:-azure}"
      TRANSLATE_LOCAL_URL: "${TRANSLATE_LOCAL_URL:-http://translator:8100}"
    volumes:
      - ./fe/public/logos/manifest.json:/app/logos/manifest.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 64M

  # ---- 배포 토폴로지 (프로파일 prod) ------------------------------------
  # 기본 `docker compose up -d`와 be/scripts/restart.ps1은 이 둘을 띄우지 않는다.
  # 평소 개발은 `npm run dev`로 FE를 돌리는 흐름 그대로다.
  #
  #   docker compose --profile prod up -d --build
  #
  # 이 구성이 필요한 이유는 성능이 아니라 보안이다 — Next의 rewrite가 클라이언트
  # X-Forwarded-For를 그대로 BE에 넘겨 IP 레이트 리밋이 우회됐다(실측: XFF 회전
  # 150 동시 요청 중 150건 통과). nginx가 XFF를 자신이 관찰한 주소로 덮어써서
  # 그 구멍을 닫는다. 자세한 내용은 deploy/nginx/nginx.conf 머리말.

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: quant-port-fe
    profiles: ["prod"]
    restart: unless-stopped
    logging: *logging
    cpu_shares: 1024
    stop_grace_period: 20s
    environment:
      # 서버 컴포넌트(SSR)가 BE를 직접 부를 때 쓰는 주소. 브라우저는 이 값을
      # 쓰지 않는다 — getApiBaseUrl()이 브라우저에서 ""를 반환해 nginx와 같은
      # 오리진으로 나간다.
      NEXT_PUBLIC_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      # 이미지에 curl·wget이 없다(slim) — Node 자체로 찌른다. standalone 서버가
      # 멈춰 있어도(행업) 컨테이너 프로세스는 살아 있을 수 있어, "떠 있음"과
      # "응답함"을 나눠 보지 않으면 nginx가 죽은 백엔드로 계속 트래픽을 보낸다.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 64M

  nginx:
    image: nginx:1.27-alpine
    container_name: quant-port-nginx
    profiles: ["prod"]
    restart: unless-stopped
    logging: *logging
    cpu_shares: 1024
    stop_grace_period: 20s
    extra_hosts:
      # app_routes.host-fe.conf → 호스트 npm run dev (:3000)
      - "host.docker.internal:host-gateway"
    ports:
      # 로컬에서 80은 다른 것이 쓰고 있을 수 있어 8088로 뺀다.
      # 도메인 연결 시 리포 루트 .env 에 NGINX_HTTP_PORT=80 · NGINX_HTTPS_PORT=443.
      # OCI 오버레이는 443 만 추가한다(80 은 base 의 NGINX_HTTP_PORT).
      #
      # **변수로 두는 이유**: compose 의 ports 는 오버레이에서 "치환"이 아니라
      # "추가"로 병합된다. 오버레이에 80:80 을 적으면 base 의 8088:80 이 그대로
      # 남아서, 배포 VM 이 의도치 않게 8088 을 0.0.0.0 에 연다.
      - "${NGINX_HTTP_PORT:-8088}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      # nginx.conf(평문) · nginx.dual.conf(80+443→FE) · nginx.tls.conf(운영 TLS)
      - ./deploy/nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      # app_routes.conf(fe:3000) · app_routes.host-fe.conf(host:3000)
      - ./deploy/nginx/${NGINX_ROUTES:-app_routes.conf}:/etc/nginx/app_routes.conf:ro
      # 스캐너 노이즈 차단(wp-admin · .php · .zip …). app_routes 두 벌이 함께 쓴다.
      - ./deploy/nginx/block_noise.conf:/etc/nginx/block_noise.conf:ro
      - ./deploy/nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./deploy/nginx/proxy_headers_fe.conf:/etc/nginx/proxy_headers_fe.conf:ro
      # nginx.dual.conf / nginx.tls.conf 용. 없으면 start-domain.ps1 이 자체 서명 생성.
      - ${NGINX_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      # host-fe 모드에서는 Docker fe 를 띄우지 않는다.
      fe:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M

volumes:
  quant_port_redis_data:
  # 번역 모델 캐시. named volume이라 컨테이너를 지웠다 다시 만들어도 470MB를
  # 다시 받지 않는다.
  quant_port_llama_models:
  # 뉴스 감성 모델 캐시(KR-FinBert-SC · FinBERT, 약 850MB).
  quant_port_sentiment_models:
  quant_port_media:
