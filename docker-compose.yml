# 이 파일은 **한 대에 다 띄우는 구성**(로컬 개발 · 단일 VM)이다.
# 클라우드에서 API VM과 배치 VM을 나눠 쓸 때는 다음을 쓴다:
#   API/FE VM : docker-compose.yml + deploy/compose/docker-compose.app.oci.yml
#               → deploy/scripts/app-stack.sh
#   배치 VM   : deploy/compose/docker-compose.batch.yml (단독 파일)
#               → deploy/scripts/batch-stack.sh
# 배경과 근거는 docs/OCI_MIGRATION_PLAN.md.

# 로그 상한 — **없으면 무제한이다.**
#
# json-file 드라이버의 기본값은 크기 제한이 없다. 요청마다 한 줄씩 쌓이고
# (middleware.Logger + nginx access_log), 부트 볼륨은 50 GiB다. 디스크가 차면
# Docker도 앱도 함께 멈추고, 그때는 SSH가 살아 있어야만 복구할 수 있다.
#
# 10m×3 = 컨테이너당 최대 30 MB, 12컨테이너에 360 MB로 고정된다.
# 호스트의 /etc/docker/daemon.json 에도 같은 기본값을 두는 것이 좋지만(새 컨테이너
# 까지 덮으므로), 그건 리포에 안 들어오는 설정이라 여기서 한 번 더 못박는다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 리소스 리밋 — 한 컨테이너가 호스트를 잠식하지 못하게 한다.
#
# 값은 실측 사용량 기준으로 넉넉히 잡았다(워커 peak 14MB → 256M, 18배).
# 좁게 잡으면 OOM kill이 배치를 조용히 죽이는 쪽이 더 위험하다.
x-worker-deploy: &worker-deploy
  resources:
    limits:
      cpus: "0.50"
      memory: 256M
    reservations:
      memory: 32M

# 워커 8개 공통 런타임. 각 서비스에서 `<<: *worker-runtime` 으로 병합한다.
# (서비스에 같은 키를 직접 쓰면 그쪽이 이긴다 — 기존 블록의 restart/healthcheck/
#  extra_hosts 는 그대로 유효하다.)
x-worker-runtime: &worker-runtime
  logging: *logging
  # CPU 가중치 — **상한이 아니라 경합 시의 배분율**이다.
  #
  # 현재 컨테이너 CPU 상한의 합은 8.5인데 운영 VM은 2 OCPU다. 상한만 있으면 경합할 때
  # CFS가 균등 분배해서, 워커 넷이 동시에 돌면 api가 1/5를 받는다. shares는 유휴일 때
  # 아무 영향이 없고 경합할 때만 비율을 바꾼다 — 성능과 안정성을 맞바꾸는 튜닝이 아니다.
  #   api 2048 : fe/nginx/redis 1024 : worker 256  → 전면 경합 시 api가 워커의 8배
  cpu_shares: 256
  # 배치는 잡 실행 중일 수 있다. 기본 10초는 진행 중인 트랜잭션을 끊기에 짧다.
  # (그래도 2시간 타임아웃으로 중간에 끊길 수 있으므로 잡의 idempotency가 본체다.)
  stop_grace_period: 60s

services:
  redis:
    image: redis:7-alpine
    container_name: quant-port-redis
    restart: unless-stopped
    logging: *logging
    cpu_shares: 1024
    ports:
      # **loopback에만 게시한다.** 0.0.0.0에 열면 공개 IP를 가진 VM에서 인증 없는
      # Redis가 인터넷에 그대로 노출된다 — Docker는 published 포트를 iptables nat
      # 테이블의 DNAT로 처리해서, 호스트 방화벽(firewalld)만 잠가서는 못 막는
      # 구성이 흔하다. 컨테이너끼리는 compose 네트워크로 붙으므로 영향이 없고,
      # 호스트에서 redis-cli 로 붙는 것도 그대로 된다.
      #
      # 배치를 다른 VM에서 돌릴 때는 이 값을 사설 IP로 바꿔야 한다 — 그때는
      # requirepass 와 NSG 제한이 함께 와야 한다(deploy/compose/docker-compose.app.oci.yml).
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    # 상한이 없으면(maxmemory 0 + noeviction, 기본값) Redis는 계속 자라다가
    # 호스트를 OOM으로 몰거나, 메모리가 차는 순간 **쓰기가 전부 에러**가 된다.
    # AGENT_STATE가 "기동 시 Redis 필수"로 못박고 있어 파급이 크다.
    #
    # 정책이 volatile-lru인 이유: TTL이 걸린 키만 버린다. 실측으로 TTL 없는 키는
    # `md:rev:<symbol>` 2,204개(각 56B, 합계 약 123KB)뿐인데, 이건 캐시 무효화용
    # INCR 카운터라 사라지면 리비전이 되감겨 낡은 캐시가 새 것으로 보인다.
    # allkeys-lru는 이걸 버릴 수 있고, volatile-lru는 정확히 이것만 보호한다.
    # 나머지(23,719키 중 21,515개)는 전부 TTL이 있어 축출 대상으로 충분하다.
    #
    # 기본 1gb는 현재 사용량 338MB·피크 482MB의 2배 이상이라 **지금은 아무것도
    # 축출되지 않는다** — 상한을 두는 것이 목적이지 캐시를 줄이는 게 아니다.
    # 클라우드에서는 인스턴스 RAM의 60~70%로 REDIS_MAXMEMORY를 넘겨 조절한다.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - quant_port_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 128M

  # BE API + Tesseract OCR — 로컬·클라우드 공통 이미지
  api:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: quant-port-api
    restart: unless-stopped
    logging: *logging
    cpu_shares: 2048
    # in-flight 요청을 비우고 배경 폴러 13개를 정리하는 데 기본 10초는 빠듯하다.
    # (Server.Shutdown 이 "HTTP 배수 → 배경 취소 → 풀 종료" 순서로 돈다.)
    stop_grace_period: 30s
    ports:
      # loopback 전용 — 이유는 redis 쪽 주석과 같고, 하나 더 있다.
      # nginx 가 X-Forwarded-For 를 자기가 관찰한 주소로 덮어써서 IP 레이트 리밋의
      # 근거를 만드는데, :8080 에 직접 붙을 수 있으면 그 덮어쓰기를 통째로 우회한다
      # (실측: XFF 를 회전시킨 150 요청이 전부 통과했다). /metrics 도 여기로 샌다.
      - "127.0.0.1:8080:8080"
    env_file:
      - ./be/.env
    environment:
      REDIS_URL: ${REDIS_URL_CONTAINER:-redis://redis:6379/0}
      IMPORT_TEMP_DIR: /var/lib/quant-port/import
      MEDIA_DIR: /var/lib/quant-port/media
      # Go GC 에게 컨테이너 상한을 알려 준다. 이게 없으면 GC 는 호스트 메모리를 보고
      # 판단하다가 cgroup 상한(1 GiB)에 부딪혀 **OOM 킬**을 당한다 — SIGKILL 이라
      # graceful shutdown 이 없고, 그러면 프로세스가 다시 뜨면서 Toss 토큰을
      # 재발급해 이전 토큰을 401 로 만든다(시세 적재가 끊긴다).
      # 800MiB = 상한의 80%. 나머지 200MiB 는 Go 런타임 밖(스택·OCR 자식 프로세스) 몫.
      GOMEMLIMIT: "800MiB"
      # 동시에 도는 tesseract 수. 비워 두면 GOMAXPROCS(= 이 컨테이너의 코어 수)를 쓴다.
      # 0 이면 상한 해제(롤백용). 근거는 be/internal/import/ocr/limit.go.
      OCR_MAX_CONCURRENCY: "${OCR_MAX_CONCURRENCY:-}"
      MYSQL_DSN: ${MYSQL_DSN:-quantport:quantport@tcp(host.docker.internal:3306)/quantport?parseTime=true&charset=utf8mb4&loc=Asia%2FSeoul}
      # 관리자 「배치 관리」에서 고친 시간표가 리포 파일과 한 벌이 되게.
      BATCH_SCHEDULE_PATH: /app/docs/BATCH_SCHEDULE.md
      # 로고 매니페스트. **없으면 BE는 모든 종목에 FMP 원격 URL을 내려보낸다** —
      # LoadManifest는 파일이 없을 때 조용히 넘어가고(os.IsNotExist → nil), 그러면
      # 리졸버가 로컬 파일을 하나도 못 쓴다. 실측으로 삼성전자까지 원격이었다.
      LOGO_MANIFEST_PATH: /app/logos/manifest.json
      # 해외 뉴스 제목 EN→KO — **Azure AI Translator**(2026-09-11 사용자 결정).
      #
      # 자체 모델(translator 컨테이너)에서 옮겨 왔다. 그 컨테이너는 아래에서
      # `legacy-translator` 프로파일로 내려가 기본 기동에서 빠진다 — 되돌리려면
      # TRANSLATE_PROVIDER=local 로 바꾸고 그 프로파일로 올린다.
      #
      # **키가 없으면 번역이 아예 안 된다**(폴백 없음): 해외 제목이 영어로 남고
      # 기동 로그가 그 사실을 찍는다.
      #
      # AZURE_TRANSLATOR_* 는 **여기 적지 않는다.** 다른 비밀값과 똑같이
      # `env_file: ./be/.env`로 들어온다 — FINNHUB_NEWS_API_KEY도 그렇다.
      # 예전에는 여기에 `"${AZURE_TRANSLATOR_KEY:-}"` 세 줄이 있었는데, compose에서
      # `environment`는 `env_file`을 **이긴다.** 그래서 be/.env에 키를 적어도 컨테이너
      # 안에서는 빈 문자열이 됐고, 키 없는 엔진은 조용히 사슬에서 빠지므로 아무 오류
      # 없이 번역만 0건이 됐다(2026-09-13 실측 `engines=local`).
      TRANSLATE_PROVIDER: "${TRANSLATE_PROVIDER:-azure}"
      TRANSLATE_LOCAL_URL: "${TRANSLATE_LOCAL_URL:-http://translator:8100}"
    volumes:
      # 사용자 업로드 이미지(리포트 본문 등)는 **영구 보관**이라 named volume이어야
      # 한다 — writable layer에 두면 재기동(recreate)마다 지워진다.
      - quant_port_media:/var/lib/quant-port/media
      - ./be/docs/BATCH_SCHEDULE.md:/app/docs/BATCH_SCHEDULE.md
      # 매니페스트는 FE가 만들어 FE 쪽에 사는 파일이다(migrate-logos의 -out).
      # 이미지에 굽지 않고 읽기 전용으로 걸어, 로고를 새로 받아도 API를 다시
      # 빌드하지 않고 재기동만 하면 되게 한다.
      - ./fe/public/logos/manifest.json:/app/logos/manifest.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      # 번역기는 **없어도 API가 뜬다**(started, healthy가 아니다). 2026-09-11에
      # Azure로 옮긴 뒤로는 이 컨테이너가 기본 기동에서 빠지므로(profiles) 이
      # 의존성은 거의 언제나 「없음」으로 풀린다 — required:false가 그걸 받는다.
      translator:
        condition: service_started
        required: false
    # import temp: 컨테이너 writable layer (디스크). job 완료 시 코드에서 RemoveAll.
    # tmpfs 미사용 — RAM 점유·256MB 상한 OOM 리스크 회피 (스크린샷 10장 peak ~수십 MB).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 128M

  # ---- 번역기 -----------------------------------------------------------
  #
  # 해외 뉴스 **제목**을 EN→KO로 옮긴다. Papago(NCP 글자 과금)를 대신하는 자체 모델로,
  # 근거와 모델 선정 과정은 be/docs/TRANSLATION_SELFHOST.md에 있다.
  #
  # **별도 컨테이너인 이유**는 격리다. 모델을 올리는 데 수십 초가 걸리고 추론이 CPU를
  # 통째로 쓰는데, 이게 API 프로세스 안에 있으면 번역 한 번이 시세 응답을 밀어낸다.
  # 여기 있으면 이상할 때 `docker compose restart translator` 하나로 끝나고, 그동안
  # API는 폴백(Papago)으로 계속 번역한다.
  #
  # llama.cpp 서버를 **그대로** 쓴다 — 우리 래퍼를 하나 더 만들지 않는다. 이 이미지는
  # OpenAI 호환 `/v1/chat/completions`를 내므로, 나중에 엔진을 vLLM·Ollama 무엇으로
  # 바꿔도 Go 쪽은 URL만 바뀐다.
  #
  # # 기본 기동에서 빠졌다 (2026-09-11 사용자 결정)
  #
  # 해외 제목 번역은 Azure AI Translator로 옮겼다 — 이유는 `be/internal/translate/azure.go`
  # 머리글에 있다(제목 한 건에 0.9~2.8초, 상시 1.5코어·2GB, 모델 적재 중에는 그 주기가
  # 통째로 영어로 남음). 정의를 **지우지 않고** 프로파일로 내린 이유는 되돌리는 길을
  # 한 줄로 남겨 두기 위해서다:
  #
  #     TRANSLATE_PROVIDER=local docker compose --profile legacy-translator up -d translator api
  #
  # Azure 쪽이 며칠 안정적으로 돌면 이 블록과 quant_port_llama_models 볼륨을 지운다.
  translator:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: quant-port-translator
    profiles: ["legacy-translator"]
    restart: unless-stopped
    logging: *logging
    # API·워커보다 낮게 둔다. 번역은 배치라 늦어도 되고, 늦어서 잃는 것이 없다.
    cpu_shares: 512
    stop_grace_period: 15s
    ports:
      # loopback 전용. 컨테이너끼리는 compose 네트워크로 붙으므로 이 포트는
      # 사람이 직접 재볼 때(cmd/compare-translation)만 쓴다.
      - "127.0.0.1:8100:8100"
    # 모델은 **첫 기동 때 HF에서 받아** 볼륨에 캐시한다. 이미지에 굽지 않는 이유는
    # 모델을 바꾸는 일이 이미지를 다시 만드는 일이 되지 않게 하기 위해서다 —
    # TRANSLATE_MODEL만 바꾸고 재기동하면 된다.
    command: >
      -hf ${TRANSLATE_MODEL:-mradermacher/LMT-60-1.7B-GGUF:Q4_K_M}
      --host 0.0.0.0 --port 8100
      --ctx-size ${TRANSLATE_CTX:-2048}
      --parallel ${TRANSLATE_SLOTS:-2}
      --threads ${TRANSLATE_THREADS:-2}
      --no-webui
    volumes:
      - quant_port_llama_models:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8100/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 첫 기동은 모델을 내려받는다(0.6B Q5_K_M ≈ 470MB). 넉넉히 준다.
      start_period: 300s
    deploy:
      resources:
        limits:
          # **0.6B가 아니라 1.7B다.** 설계서는 0.6B로 시작한다고 적었는데 실측에서
          # 회사 이름을 지어냈다 — "Nvidia stock slips…"가 「에버넷의 주가가 하락」이
          # 되고 "Fed holds rates steady"가 「금리 인상」으로 뜻이 뒤집혔다.
          # 1.7B는 같은 문장을 옳게 옮겼고 속도는 오히려 비슷했다(실측 856~1,158ms
          # 대 988~1,615ms). 배치라 초 단위 차이는 값이 아니고, 틀린 번역이 값이다.
          # Q4_K_M 가중치 1.1GB + KV → RSS 약 1.6GB.
          cpus: "${TRANSLATE_CPUS:-1.5}"
          memory: ${TRANSLATE_MEMORY:-2G}
        reservations:
          memory: 128M

  # ---- 배치 워커 --------------------------------------------------------
  # 잡별로 별도 컨테이너로 분리: 한 배치가 멈추거나 자원을 과점해도 API나
  # 다른 배치에 영향을 주지 않는다. 이미지는 api와 동일(멀티스테이지 빌드에서
  # 워커 바이너리도 함께 만들어짐), command로 실행할 바이너리만 바꾼다.
  # 자세한 배경은 docs/AGENT_STATE.md "배치 잡을 독립 워커 프로세스로 분리" 참조.

  worker-close-domestic:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: quant-port-worker-close-domestic
    <<: *worker-runtime
    command: ["./worker-close-domestic"]
    restart: unless-stopped
    env_file:
      - ./be/.env
    environment:
      REDIS_URL: ${REDIS_URL_CONTAINER:-redis://redis:6379/0}
      MYSQL_DSN: ${MYSQL_DSN:-quantport:quantport@tcp(host.docker.internal:3306)/quantport?parseTime=true&charset=utf8mb4&loc=Asia%2FSeoul}
      # 워커는 잡을 하나씩 순차로 돌린다(배치 코드에 동시성 풀이 없다). 그런데
      # repository.NewMySQL의 기본값은 API 기준인 50이라, 이 컨테이너 8개가
      # 그대로 뜨면 워커만으로 최대 400 커넥션을 연다 — MySQL 기본
      # max_connections는 151이다. 배정 총합은 api 24 + 워커 8x4 = 56 (37%)로,
