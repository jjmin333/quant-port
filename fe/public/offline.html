<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>연결 끊김 · Quant Port</title>
<!-- 서비스 워커(sw.js)가 오프라인일 때 보여 준다. 외부 파일 없이 혼자 그려져야 한다. -->
<style>
  :root { color-scheme: light dark; --bg: #f5f5f5; --fg: #171717; --muted: #737373; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171717; --fg: #fafafa; --muted: #a3a3a3; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  main { padding: 24px 16px; text-align: center; max-width: 360px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
  button { font: inherit; font-weight: 600; padding: 10px 20px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
    <rect width="32" height="32" rx="7" fill="#2563EB"/>
    <rect x="5" y="18" width="5" height="9" rx="1.5" fill="#fff"/>
    <rect x="13.5" y="13" width="5" height="14" rx="1.5" fill="#fff"/>
    <rect x="22" y="7" width="5" height="20" rx="1.5" fill="#fff"/>
  </svg>
  <h1>인터넷에 연결되어 있지 않습니다</h1>
  <p>연결이 돌아오면 다시 시도해 주세요.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
</main>
<script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
