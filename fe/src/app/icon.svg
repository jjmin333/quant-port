<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Quant Port">
  <!--
    브랜드 마크(2026-10-21 확정): 미드나이트 패널 위 Q 모노그램 — 흰 고리 + 하늘색 꼬리.
    Q이면서 돋보기로 읽힌다. 16px에서도 형태가 남도록 글자를 쓰지 않고 도형만 썼다.

    같은 도형을 세 곳이 따로 그린다 — 고치면 같이 고칠 것:
    `scripts/gen-icons.mjs`(favicon.ico·apple-icon.png·PWA 아이콘),
    `opengraph-image.tsx`, `components/layout/header.tsx`(BrandLink).
  -->
  <defs>
    <linearGradient id="qp-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2541" />
      <stop offset="1" stop-color="#0A0F1E" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#qp-panel)" />
  <circle cx="15" cy="15" r="8" fill="none" stroke="#fff" stroke-width="3.4" />
  <path d="M20 20 25.5 25.5" stroke="#6E9BFF" stroke-width="3.4" stroke-linecap="round" />
</svg>
