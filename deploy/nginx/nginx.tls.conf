# quant-port 엣지 리버스 프록시 — **TLS 구성** (클라우드 전용).
#
# 평문 구성(nginx.conf)과 라우팅은 완전히 같다. 다른 것은 셋뿐이다:
#   1. :443 에서 TLS 종단
#   2. :80 은 ACME 챌린지만 받고 나머지는 301
#   3. HSTS
# 라우팅 본문은 app_routes.conf 한 벌을 양쪽이 include 한다 — 파일을 복사해 두면
# 한쪽만 고쳐지고 그 차이는 배포한 뒤에야 드러난다.
#
# ── 쓰는 법 ──────────────────────────────────────────────────────────────
# 1) 도메인·인증서 경로는 VM 마다 다르므로 리포에 넣지 않는다.
#    deploy/nginx/tls_site.conf.example 을 VM 의 /etc/quant-port/nginx-tls-site.conf
#    로 복사해 도메인을 채운다(app.oci.yml 이 그 파일을 마운트한다).
# 2) 인증서가 없으면 :443 블록이 뜨지 못한다. **최초 발급은 평문으로 먼저** 올려
#    ACME 챌린지를 통과시킨 뒤 NGINX_CONF=nginx.tls.conf 로 바꾼다.
#      NGINX_CONF=nginx.conf ./deploy/scripts/app-stack.sh up
#      certbot certonly --webroot -w /var/www/certbot -d <domain>
#      # deploy/.env.app 에 NGINX_CONF=nginx.tls.conf 를 넣고
#      ./deploy/scripts/app-stack.sh up
# 3) 갱신 후 리로드: docker kill -s HUP quant-port-nginx   (무중단)
#
# XFF 신뢰의 근거와 resolver 를 변수로 쓰는 이유는 nginx.conf 머리말과 같다.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format edge '$remote_addr "$request" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log edge;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  # Cloudflare는 오리진 연결을 최대 900초까지 놀려 두고 다시 쓴다. 오리진이 먼저(예전 65초)
  # 끊으면 매번 새 연결이 필요하고, 그 연결 수립은 Cloudflare 엣지(홍콩 등) ↔ KT 구간을 건넌다.
  # 2026-09-25 저녁 실측: 그 구간에서 SYN/세그먼트가 유실돼 첫 바이트가 1~16초로 튀었다
  # (nginx 처리 시간은 3~5ms, 호스트 재전송 카운터가 연결당 약 1씩 증가). 프록시 뒤의
  # 오리진은 프록시보다 오래 잡아야 끊는 쪽이 늘 프록시가 된다 — 새 연결 수 자체를 줄인다.
  keepalive_timeout 905s;
  keepalive_requests 10000;

  # 압축은 BE 가 이미 한다(chi Compress). SSE 에는 절대 걸리면 안 된다.
  gzip off;

  client_max_body_size 20m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---- TLS 공통 ----------------------------------------------------------
  # 1.2 미만은 받지 않는다. 1.3 을 먼저 협상한다.
  ssl_protocols TLSv1.2 TLSv1.3;
  # 1.3 에서는 클라이언트 선호를 따르는 편이 낫다.
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  # 티켓 키를 회전시킬 운영 절차가 없다. 끄는 편이 PFS 를 지킨다.
  ssl_session_tickets off;

  # ---- :80 — ACME 와 리다이렉트만 ---------------------------------------
  server {
    listen 80;
    server_name _;

    # certbot --webroot 가 여기에 토큰을 쓴다. 이 경로만 평문으로 응답한다.
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      access_log off;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- :443 — 실제 서비스 ------------------------------------------------
  server {
    listen 443 ssl;
    http2 on;

    # server_name · 인증서 경로 · HSTS. VM 마다 다르므로 호스트 파일에서 온다.
    # 모양은 deploy/nginx/tls_site.conf.example 참조.
    include /etc/nginx/tls_site.conf;

    include /etc/nginx/app_routes.conf;
  }
}
