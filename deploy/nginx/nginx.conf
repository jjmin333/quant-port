# quant-port 엣지 리버스 프록시.
#
# 브라우저 → nginx → (/api/* → api:8080 | 그 외 → fe:3000)
#
# 이 파일이 존재하는 첫째 이유는 성능이 아니라 **X-Forwarded-For의 신뢰**다.
# 예전 구성은 Next의 rewrite가 /api/*를 BE로 넘겼는데, 그 rewrite는 클라이언트가
# 보낸 XFF를 그대로 전달한다. 실측으로 확인했다 — XFF를 회전시키며 요청을 보내니
# 전부 통과했고, BE의 IP 레이트 리밋이 무력화된다는 뜻이었다. 여기서 XFF를
# nginx가 직접 관찰한 주소로 덮어쓰면 그 구멍이 닫힌다.
#
# 부수 효과로 API 트래픽이 Node 홉을 거치지 않는다. 2초 폴링 3종과 SSE가 전부
# 그 홉을 지나고 있었다.
#
# **주의**: 공통 프록시 헤더는 반드시 각 location에서 include 한다.
# proxy_set_header는 상속이 merge가 아니라 replace라, location이 자기 것을
# 하나라도 선언하면 상위 것이 전부 사라진다. 자세한 내용은 proxy_headers.conf.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # $remote_addr는 이 시점에 TCP 소켓의 상대 주소다. nginx가 엣지이므로 그것이
  # 곧 진짜 클라이언트다.
  log_format edge '$remote_addr "$request" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log edge;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # 압축은 BE가 이미 한다(chi Compress). 여기서 또 켜면 이미 gzip된 응답을
  # 다시 만지작거릴 뿐이고, SSE에는 절대 걸리면 안 된다.
  gzip off;

  # 업로드(리포트 본문 이미지). BE의 MEDIA_MAX_UPLOAD_MB와 맞춘다.
  client_max_body_size 20m;

  upstream api_upstream {
    server api:8080;
    keepalive 32;
  }

  upstream fe_upstream {
    server fe:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;

    # ---- SSE ---------------------------------------------------------------
    # 시세 스트림은 응답이 끝나지 않는다. 버퍼링을 켜 두면 nginx가 프레임을
    # 모아 두어 화면이 멈춘 것처럼 보이고, 기본 60초 read timeout이 연결을
    # 끊는다. BE 쪽은 이미 WriteTimeout을 SSE에서 해제해 두었다.
    location ~ ^/api/v1/quotes/[^/]+/(quote-)?stream$ {
      include /etc/nginx/proxy_headers.conf;
      proxy_pass http://api_upstream;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---- API ---------------------------------------------------------------
    location /api/ {
      include /etc/nginx/proxy_headers.conf;
      proxy_pass http://api_upstream;
      proxy_read_timeout 60s;
    }

    # 헬스 체크는 BE 것을 그대로 노출한다 — 로드밸런서가 볼 지점.
    location = /health {
      include /etc/nginx/proxy_headers.conf;
      proxy_pass http://api_upstream;
      access_log off;
    }
    location = /ready {
      include /etc/nginx/proxy_headers.conf;
      proxy_pass http://api_upstream;
      access_log off;
    }

    # 업로드 이미지. 공개 경로이고 키가 콘텐츠 해시라 URL 자체가 권한이다.
    location /media/ {
      include /etc/nginx/proxy_headers.conf;
      proxy_pass http://api_upstream;
    }

    # ---- 프런트엔드 --------------------------------------------------------
    location / {
      include /etc/nginx/proxy_headers.conf;
      proxy_pass http://fe_upstream;
      proxy_read_timeout 60s;
    }
  }
}
