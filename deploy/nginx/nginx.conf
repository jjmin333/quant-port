# quant-port 엣지 리버스 프록시.
#
# 브라우저 → nginx → (/api/* → api:8080 | 그 외 → fe:3000)
#
# 이 파일이 존재하는 첫째 이유는 성능이 아니라 **X-Forwarded-For의 신뢰**다.
# 예전 구성은 Next의 rewrite가 /api/*를 BE로 넘겼는데, 그 rewrite는 클라이언트가
# 보낸 XFF를 그대로 전달한다. 실측으로 확인했다 — XFF를 회전시키며 요청을 보내니
# 전부 통과했고, BE의 IP 레이트 리밋이 무력화된다는 뜻이었다. 여기서 XFF를
# nginx가 직접 관찰한 주소로 덮어쓰면 그 구멍이 닫힌다.
#
# 부수 효과로 API 트래픽이 Node 홉을 거치지 않는다. 2초 폴링 3종과 SSE가 전부
# 그 홉을 지나고 있었다.
#
# **주의**: 공통 프록시 헤더는 반드시 각 location에서 include 한다.
# proxy_set_header는 상속이 merge가 아니라 replace라, location이 자기 것을
# 하나라도 선언하면 상위 것이 전부 사라진다. 자세한 내용은 proxy_headers.conf.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # $remote_addr는 이 시점에 TCP 소켓의 상대 주소다. nginx가 엣지이므로 그것이
  # 곧 진짜 클라이언트다.
  # 앞 다섯 칸은 예전 그대로(경로별 p50/p95 스크립트가 위치로 읽는다). 뒤에 붙인 것(2026-10-21 티켓 QP-06):
  # 시각(UTC 오프셋 포함) · 실제 방문자 IP(Cloudflare가 준다 — Docker Desktop NAT 뒤라 $remote_addr는 늘
  # 172.18.0.1이다) · Host · referer · UA. 봇과 사람, 검색 유입을 가르려면 이것들이 있어야 한다.
  log_format edge '$remote_addr "$request" $status $body_bytes_sent $request_time '
                  '$time_iso8601 cf=$http_cf_connecting_ip host=$host ref="$http_referer" ua="$http_user_agent"';
  access_log /var/log/nginx/access.log edge;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  # Cloudflare는 오리진 연결을 최대 900초까지 놀려 두고 다시 쓴다. 오리진이 먼저(예전 65초)
  # 끊으면 매번 새 연결이 필요하고, 그 연결 수립은 Cloudflare 엣지(홍콩 등) ↔ KT 구간을 건넌다.
  # 2026-09-25 저녁 실측: 그 구간에서 SYN/세그먼트가 유실돼 첫 바이트가 1~16초로 튀었다
  # (nginx 처리 시간은 3~5ms, 호스트 재전송 카운터가 연결당 약 1씩 증가). 프록시 뒤의
  # 오리진은 프록시보다 오래 잡아야 끊는 쪽이 늘 프록시가 된다 — 새 연결 수 자체를 줄인다.
  keepalive_timeout 905s;
  keepalive_requests 10000;

  # 압축은 BE가 이미 한다(chi Compress). 여기서 또 켜면 이미 gzip된 응답을
  # 다시 만지작거릴 뿐이고, SSE에는 절대 걸리면 안 된다.
  gzip off;

  # 업로드(리포트 본문 이미지). BE의 MEDIA_MAX_UPLOAD_MB와 맞춘다.
  client_max_body_size 20m;

  # `upstream { server api:8080; }` 블록은 **nginx 기동 시 한 번만** DNS를 풀어
  # 그 IP를 프로세스 수명 내내 쓴다. 컨테이너가 재기동해 새 IP를 받으면(재배포,
  # OOM 복구, `restart.ps1`의 `docker compose up -d --build api`) nginx는 죽은
  # 옛 IP만 계속 다이얼해 `/api/*` 전체가 502가 되고, **nginx를 손으로 재기동
  # 해야만** 풀린다(실측: 08-22, api 컨테이너 재빌드 후 21시간째 502).
  #
  # 변수에 담아 `proxy_pass`하면 매 요청 재해석이 걸린다 — Docker 내장 DNS
  # (127.0.0.11)가 컨테이너 재기동마다 이름을 새 IP로 갱신해 주므로, api·fe가
  # 몇 번을 다시 뜨든 nginx는 그냥 따라간다. 대가는 `upstream{}`의 커넥션 풀
  # (`keepalive`)을 잃는 것 — 이 트래픽 규모에서는 "손으로 재기동해야 사는
  # 서비스"보다 그 편이 낫다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # **알려진 Host만 받는다** (2026-10-21 티켓 QP-03). 예전에는 `server_name _` 하나가 아무 Host에나 사이트
  # 전체를 줘서 공인 IP로 바로 들어오면 Cloudflare(WAF·캐시)를 건너뛰었다(10-20 점검, IP 주소로 들어온
  # 사용자의 오류 보고가 실제로 있었다). 그 밖의 Host는 응답 없이 끊는다(444). localhost·127.0.0.1은 헬스체크와
  # 워치독, nginx는 growth 크롤러(`GROWTH_CRAWL_ORIGIN: http://nginx`)가 쓴다.
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 80;
    server_name www.quant-port.com quant-port.com localhost 127.0.0.1 nginx;

    include /etc/nginx/app_routes.conf;
  }
}
