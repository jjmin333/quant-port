# app_routes.conf 와 동일 — FE 업스트림만 호스트 :3000 으로 바꾼다.
# npm run dev (0.0.0.0:3000) + nginx 80/443 조합에서 쓴다.

# 스캐너 노이즈 차단 — app_routes.conf 와 같은 자리(맨 위)에서 include 한다.
include /etc/nginx/block_noise.conf;

proxy_http_version 1.1;

set $api_upstream http://api:8080;
set $fe_upstream http://host.docker.internal:3000;

location ~ ^/api/v1/quotes/[^/]+/(quote-)?stream$ {
  include /etc/nginx/proxy_headers.conf;
  proxy_pass $api_upstream;
  proxy_buffering off;
  proxy_cache off;
  chunked_transfer_encoding off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

location /api/ {
  include /etc/nginx/proxy_headers.conf;
  proxy_pass $api_upstream;
  proxy_read_timeout 60s;
}

location = /health {
  include /etc/nginx/proxy_headers.conf;
  proxy_pass $api_upstream;
  access_log off;
}
location = /ready {
  include /etc/nginx/proxy_headers.conf;
  proxy_pass $api_upstream;
  access_log off;
}

location /media/ {
  include /etc/nginx/proxy_headers.conf;
  proxy_pass $api_upstream;
}

# ---- 공개 정적 파일 캐시 ------------------------------------------------
# Next public 폴더 파일은 기본이 `max-age=0`이라 Cloudflare가 **매 요청 오리진에 재검증**
# 하러 온다 — 그 왕복이 손실 많은 국제 구간을 건넌다(2026-09-25: 로고 REVALIDATED ·
# robots EXPIRED · sitemap DYNAMIC, 크롤러가 sitemap에서 30초 · 524). 수명을 주고
# stale-while-revalidate를 붙이면 엣지가 오리진을 기다리지 않고 답한다.
# 로고는 refresh-logos로만 바뀐다(하루 낡아도 된다). sitemap·robots는 한 시간.
# add_header에 always를 안 붙인다 — 404·5xx는 캐시되면 안 된다.
location ^~ /logos/ {
  include /etc/nginx/proxy_headers_fe.conf;
  proxy_pass $fe_upstream;
  proxy_http_version 1.1;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
}
location ~ ^/(robots\.txt|sitemap\.xml|favicon\.ico)$ {
  include /etc/nginx/proxy_headers_fe.conf;
  proxy_pass $fe_upstream;
  proxy_http_version 1.1;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
}

# ---- 프런트엔드 --------------------------------------------------------
location / {
  include /etc/nginx/proxy_headers_fe.conf;
  proxy_pass $fe_upstream;
  proxy_read_timeout 60s;
  proxy_http_version 1.1;
}
