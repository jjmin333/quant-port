# 라우팅 본문 — server {} 안에서 include 한다.
#
# 평문(nginx.conf)과 TLS(nginx.tls.conf) 두 구성이 **같은 라우팅**을 써야 하므로
# 여기 한 벌만 둔다. 예전처럼 파일을 복사해 두면 한쪽만 고쳐지고, 그 차이는
# 배포한 뒤에야 드러난다.
#
# **주의**: 공통 프록시 헤더는 반드시 각 location 에서 include 한다.
# proxy_set_header 는 상속이 merge 가 아니라 replace 라, location 이 자기 것을
# 하나라도 선언하면 상위 것이 전부 사라진다. 자세한 내용은 proxy_headers.conf.

# ---- 스캐너 노이즈 --------------------------------------------------------
# **맨 위여야 한다.** nginx 는 정규식 location 을 적힌 순서대로 검사하고 첫 매치가
# 이긴다 — wp-admin · .php · .zip 따위를 여기서 끊어야 Node 홉도 렌더도 없다.
# 이유와 실측은 block_noise.conf 머리말.
include /etc/nginx/block_noise.conf;

proxy_http_version 1.1;

set $api_upstream http://api:8080;
set $fe_upstream http://fe:3000;

# ---- SSE ---------------------------------------------------------------
# 시세 스트림은 응답이 끝나지 않는다. 버퍼링을 켜 두면 nginx가 프레임을
# 모아 두어 화면이 멈춘 것처럼 보이고, 기본 60초 read timeout이 연결을
# 끊는다. BE 쪽은 이미 WriteTimeout을 SSE에서 해제해 두었다.
location ~ ^/api/v1/quotes/[^/]+/(quote-)?stream$ {
  include /etc/nginx/proxy_headers.conf;
  proxy_pass $api_upstream;
  proxy_buffering off;
  proxy_cache off;
  chunked_transfer_encoding off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# ---- API ---------------------------------------------------------------
location /api/ {
  include /etc/nginx/proxy_headers.conf;
  proxy_pass $api_upstream;
  proxy_read_timeout 60s;
}

# 헬스 체크는 BE 것을 그대로 노출한다 — 로드밸런서가 볼 지점.
location = /health {
  include /etc/nginx/proxy_headers.conf;
  proxy_pass $api_upstream;
  access_log off;
}
location = /ready {
  include /etc/nginx/proxy_headers.conf;
  proxy_pass $api_upstream;
  access_log off;
}

# 업로드 이미지. 공개 경로이고 키가 콘텐츠 해시라 URL 자체가 권한이다.
location /media/ {
  include /etc/nginx/proxy_headers.conf;
  proxy_pass $api_upstream;
}

# ---- 공개 정적 파일 캐시 ------------------------------------------------
# Next public 폴더 파일은 기본이 `max-age=0`이라 Cloudflare가 **매 요청 오리진에 재검증**
# 하러 온다 — 그 왕복이 손실 많은 국제 구간을 건넌다(2026-09-25: 로고 REVALIDATED ·
# robots EXPIRED · sitemap DYNAMIC, 크롤러가 sitemap에서 30초 · 524). 수명을 주고
# stale-while-revalidate를 붙이면 엣지가 오리진을 기다리지 않고 답한다.
# 로고는 refresh-logos로만 바뀐다(하루 낡아도 된다). sitemap·robots는 한 시간.
# add_header에 always를 안 붙인다 — 404·5xx는 캐시되면 안 된다.
location ^~ /logos/ {
  include /etc/nginx/proxy_headers_fe.conf;
  proxy_pass $fe_upstream;
  proxy_http_version 1.1;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
}
location ~ ^/(robots\.txt|sitemap\.xml|favicon\.ico)$ {
  include /etc/nginx/proxy_headers_fe.conf;
  proxy_pass $fe_upstream;
  proxy_http_version 1.1;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
}

# ---- 프런트엔드 --------------------------------------------------------
location / {
  include /etc/nginx/proxy_headers_fe.conf;
  proxy_pass $fe_upstream;
  proxy_read_timeout 60s;
  proxy_http_version 1.1;
}
