# 스캐너 노이즈를 **앱에 닿기 전에** 끊는다.
#
# ── 왜 여기인가 ──────────────────────────────────────────────────────────
# 2026-09-05 실측 로그:
#
#   [22:11:34 KST] user= name= GET /wp-admin/install.php?step=1
#   GET /wp-admin/install.php?step=1 404 in 232ms
#     (next.js: 13ms, proxy.ts: 24ms, application-code: 195ms)
#
# 그 아래로 `.zip` GET 이 줄줄이 이어졌다. 사람이 아니라 인터넷을 훑는 봇이다.
# 문제는 **404 를 만드는 데 232ms 를 썼다**는 것이다 — nginx 를 지나 Node 로 가서
# proxy.ts 의 요청 로그를 찍고, Next 라우터가 매칭에 실패한 뒤, not-found 페이지를
# 렌더해서 돌려준다. 봇 한 대가 초당 몇십 건을 쏘면 그 195ms 짜리 렌더가 실제
# 사용자의 시세·뉴스 요청과 같은 Node 이벤트 루프를 놓고 경합한다.
#
# 우리는 WordPress·PHP·아카이브를 **하나도** 서비스하지 않는다. 그러니 이 요청들은
# 판단할 것이 없다 — 엣지에서 끊는 것이 가장 싸다(0ms, Node 홉 없음, 렌더 없음).
#
# ── 왜 444 인가 ─────────────────────────────────────────────────────────
# 404 를 돌려주면 상태줄·헤더·본문을 만들어 보내야 하고, 봇에게 「여기 서버가 산다」는
# 답을 준다. nginx 전용 코드 444 는 응답을 만들지 않고 커넥션을 그냥 닫는다 —
# 바이트 0, 렌더 0. 스캐너 입장에서는 응답이 없는 포트와 구분되지 않는다.
#
# ── 왜 로그를 끄는가 ────────────────────────────────────────────────────
# 이 트래픽의 본질이 「양」이다. 끊어 놓고 줄을 계속 쓰면 디스크만 옮겨 담는 꼴이다
# (docker-compose.yml 머리말: 부트 볼륨 50GiB, 로그가 차면 서비스가 멈춘다).
# 차단이 도는지 확인하려면 로그가 아니라 직접 쏴 보면 된다:
#
#   curl -sS -o /dev/null -w '%{http_code}\n' http://localhost/wp-admin/install.php
#   → curl: (52) Empty reply from server   (= 444, 끊겼다)
#
# ── 순서가 곧 규칙이다 ──────────────────────────────────────────────────
# nginx 의 정규식 location 은 **적힌 순서대로** 검사하고 첫 번째로 맞는 것이 이긴다.
# 그래서 이 파일은 app_routes*.conf 의 **맨 위**에서 include 한다. 아래에 있으면
# SSE·/api 정규식이 먼저 걸릴 수 있다.
#
# 정규식 location 은 `location /api/` 같은 **접두 매치보다 우선**한다. 즉
# `/api/....zip` 도 여기서 끊긴다 — 의도한 대로다.
#
# ── 앱 경로를 절대 물지 않게 ────────────────────────────────────────────
# 아래 이름들은 실제 라우트라 **패턴에 넣으면 안 된다**:
#   admin · ai-analysis · analysis · calendar · dashboard · disclosures ·
#   earnings · financials · holdings · journal · market · news · reports ·
#   settings · stamps · stocks · targets · watchlist · login · signup · dev ·
#   api · media · health · ready · _next · logos
# 특히 `/admin` 은 우리 화면이다 — 아래에서 막는 것은 Joomla 의 `/administrator`
# 이지 `/admin` 이 아니다.

# ---- 확장자 -------------------------------------------------------------
# 우리가 내보내는 것은 HTML · JS · CSS · 이미지 · JSON 뿐이다. 아래 확장자는
# 서비스한 적도, 할 계획도 없다: 실행 스크립트 · 아카이브 · 백업 · 덤프.
#
# `.zip` 이 이 목록에 있는 이유가 이번 사건이다 — 봇은 도메인 이름을 바꿔 가며
# `site.zip` · `backup.zip` · `www.zip` 을 훑는다.
location ~* \.(php[0-9s]?|pht|phtml|phar|asp|aspx|ashx|asmx|jsp|jspx|cgi|pl|py|rb|sh|bash|exe|dll|bak|old|orig|save|swp|swo|tmp|ini|conf|cfg|log|sql|db|sqlite|dump|zip|rar|7z|tar|tgz|gz|bz2|xz|war|jar|iso|pem|key)$ {
  access_log off;
  return 444;
}

# ---- 숨김 파일 · 저장소 메타 -------------------------------------------
# `.env` · `.git/config` · `.aws/credentials` — 자격증명을 통째로 주워 가려는 탐침.
#
# `.well-known` 만 예외다: ACME 챌린지(certbot)와 `security.txt` 가 그 아래 산다.
# PCRE 부정 전방탐색으로 그 하나만 빼 둔다.
location ~* ^/\.(?!well-known/) {
  access_log off;
  return 444;
}

# ---- CMS · 관리도구 · 프레임워크 디버그 엔드포인트 ----------------------
# 확장자로 안 걸리는 것들(`/wp-admin/`, `/vendor/`, `/actuator` …)을 이름으로 끊는다.
# 전부 우리가 쓰지 않는 스택이다.
location ~* ^/(wp-|wordpress|xmlrpc|wlwmanifest|phpmyadmin|phpMyAdmin|pma|myadmin|mysqladmin|adminer|administrator|joomla|drupal|typo3|magento|bitrix|cgi-bin|vendor/|composer|_ignition|telescope|actuator|solr/|druid/|jenkins|hudson|manager/html|owa/|ecp/|autodiscover|boaform|HNAP1|geoserver|struts|webdav|remote/fgt_lang|\+CSCO) {
  access_log off;
  return 444;
}
