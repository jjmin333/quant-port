# quant-port 엣지 — :80 과 :443 모두 FE(:3000)로 프록시한다.
#
# FE는 호스트 npm run dev (host.docker.internal:3000) 또는 Docker fe 컨테이너.
# app_routes 는 NGINX_ROUTES 로 고른다:
#   app_routes.conf         → fe:3000 (Docker FE)
#   app_routes.host-fe.conf → host.docker.internal:3000 (로컬 dev)
#
# TLS 인증서: ./deploy/certs/fullchain.pem · privkey.pem
# (be/scripts/start-domain.ps1 이 없으면 자체 서명을 만든다)

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # 앞 다섯 칸은 예전 그대로(경로별 p50/p95 스크립트가 위치로 읽는다). 뒤에 붙인 것(2026-10-21 티켓 QP-06):
  # 시각(UTC 오프셋 포함) · 실제 방문자 IP(Cloudflare가 준다 — Docker Desktop NAT 뒤라 $remote_addr는 늘
  # 172.18.0.1이다) · Host · referer · UA. 봇과 사람, 검색 유입을 가르려면 이것들이 있어야 한다.
  log_format edge '$remote_addr "$request" $status $body_bytes_sent $request_time '
                  '$time_iso8601 cf=$http_cf_connecting_ip host=$host ref="$http_referer" ua="$http_user_agent"';
  access_log /var/log/nginx/access.log edge;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  # Cloudflare는 오리진 연결을 최대 900초까지 놀려 두고 다시 쓴다. 오리진이 먼저(예전 65초)
  # 끊으면 매번 새 연결이 필요하고, 그 연결 수립은 Cloudflare 엣지(홍콩 등) ↔ KT 구간을 건넌다.
  # 2026-09-25 저녁 실측: 그 구간에서 SYN/세그먼트가 유실돼 첫 바이트가 1~16초로 튀었다
  # (nginx 처리 시간은 3~5ms, 호스트 재전송 카운터가 연결당 약 1씩 증가). 프록시 뒤의
  # 오리진은 프록시보다 오래 잡아야 끊는 쪽이 늘 프록시가 된다 — 새 연결 수 자체를 줄인다.
  keepalive_timeout 905s;
  keepalive_requests 10000;
  gzip off;
  client_max_body_size 20m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # **알려진 Host만 받는다** (2026-10-21 티켓 QP-03). 예전에는 `server_name _` 하나가 아무 Host에나 사이트
  # 전체를 줘서 공인 IP로 바로 들어오면 Cloudflare(WAF·캐시)를 건너뛰었다(10-20 점검, IP 주소로 들어온
  # 사용자의 오류 보고가 실제로 있었다). 그 밖의 Host는 응답 없이 끊는다(444). localhost·127.0.0.1은 헬스체크와
  # 워치독, nginx는 growth 크롤러(`GROWTH_CRAWL_ORIGIN: http://nginx`)가 쓴다.
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  # 443도 같다 — 모르는 SNI(IP로 직접 연 TLS 포함)는 인증서를 내주기 전에 끊는다.
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
  }

  server {
    listen 80;
    server_name www.quant-port.com quant-port.com localhost 127.0.0.1 nginx;
    include /etc/nginx/app_routes.conf;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name www.quant-port.com quant-port.com localhost 127.0.0.1 nginx;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    include /etc/nginx/app_routes.conf;
  }
}
