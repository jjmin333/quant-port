# quant-port 엣지 — :80 과 :443 모두 FE(:3000)로 프록시한다.
#
# FE는 호스트 npm run dev (host.docker.internal:3000) 또는 Docker fe 컨테이너.
# app_routes 는 NGINX_ROUTES 로 고른다:
#   app_routes.conf         → fe:3000 (Docker FE)
#   app_routes.host-fe.conf → host.docker.internal:3000 (로컬 dev)
#
# TLS 인증서: ./deploy/certs/fullchain.pem · privkey.pem
# (be/scripts/start-domain.ps1 이 없으면 자체 서명을 만든다)

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format edge '$remote_addr "$request" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log edge;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip off;
  client_max_body_size 20m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  server {
    listen 80;
    server_name _;
    include /etc/nginx/app_routes.conf;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    include /etc/nginx/app_routes.conf;
  }
}
