# 모든 프록시 location이 include 해야 하는 공통 헤더.
#
# **왜 파일로 뺐는가.** nginx의 proxy_set_header는 상위 블록에서 상속되다가,
# 하위 location이 proxy_set_header를 **하나라도** 선언하는 순간 상위 것이 전부
# 버려진다(merge가 아니라 replace다). 처음엔 server 블록에 한 번만 적어 뒀는데
# 각 location이 `proxy_set_header Connection '';` 한 줄을 갖고 있어서
# X-Forwarded-For가 통째로 사라졌고, 그 결과 클라이언트가 보낸 XFF가 그대로
# BE에 전달됐다 — 막으려던 위조 우회가 그대로 열려 있었다.
# 실측으로 잡았다: 한도를 1rps/burst5로 낮추고 XFF를 회전시키니 40건 전부 통과.

# X-Forwarded-For를 **덮어쓴다**($proxy_add_x_forwarded_for가 아니라).
# nginx가 엣지이므로 $remote_addr가 곧 진짜 클라이언트이고, 클라이언트가 보낸
# 값은 쓸모가 없다.
#
# 앞에 CDN이나 ALB를 더 두게 되면 이 줄을 $proxy_add_x_forwarded_for로 바꾸고
# `set_real_ip_from <그 대역>`을 추가해야 한다. 그러지 않으면 진짜 클라이언트가
# 아니라 ALB IP로 집계된다.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Host              $host;

# upstream keepalive를 쓰려면 hop-by-hop Connection 헤더를 비워야 한다.
proxy_set_header Connection        "";
