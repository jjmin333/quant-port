# API/FE VM 오버레이 — 루트 docker-compose.yml 위에 겹쳐 쓴다.
#
#   docker compose -f docker-compose.yml \
#                  -f deploy/compose/docker-compose.app.oci.yml \
#                  --profile prod up -d <app 서비스들>
#
# 실제로는 deploy/scripts/app-stack.sh 가 이 조합을 대신 실행한다.
#
# 이 파일이 base와 다른 점은 **클라우드에서만 참인 것**뿐이다 —
# 공개 IP가 붙고, TLS가 필요하고, 배치가 다른 VM에서 이 Redis를 쓴다.
# 로컬 개발에는 겹치지 않는다.
#
# ── 배치 VM과 Redis를 공유해야 하는 이유 (중요) ──────────────────────────
# 배치 VM에 Redis를 따로 띄우면 **안 된다.** worker_bootstrap.go 가 Redis에서
# 세 가지를 공유한다:
#   1. toss.NewTokenStore  — Toss는 client_id당 활성 토큰이 하나다. 워커가 자기
#      Redis를 쓰면 자기 토큰을 새로 발급하고, 그 순간 API의 토큰이 401이 된다.
#      (배포 직후 두 연결이 서로 토큰을 죽인 사고가 실제로 있었다.)
#   2. apibudget.NewManager — 외부 API 사용량을 API 프로세스와 같은 버킷에서 센다.
#      나뉘면 한도를 두 배로 쓰고 관리자 화면의 사용량이 거짓이 된다.
#   3. MarketIndexStore     — API 폴러가 쓴 지수 스냅샷을 워커가 읽는다.
# 그래서 이 VM의 Redis를 사설 IP에 열고(REDIS_BIND), requirepass를 걸고,
# NSG로 배치 VM만 6379에 닿게 한다.
# ─────────────────────────────────────────────────────────────────────────

services:
  redis:
    # REDIS_BIND 는 이 VM의 **사설 IP**여야 한다(0.0.0.0 아님).
    # 배치 VM이 없다면 base의 기본값(127.0.0.1)을 그대로 두면 된다.
    ports:
      - "${REDIS_BIND:?REDIS_BIND 를 이 VM의 사설 IP 또는 127.0.0.1 로 설정하세요}:6379:6379"
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - volatile-lru
      # 사설망에 열리는 순간 비밀번호가 없으면 안 된다. NSG는 방어의 한 겹일 뿐이고,
      # Docker는 published 포트를 nat 테이블 DNAT로 처리해 호스트 방화벽을 우회한다.
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 를 설정하세요}
    healthcheck:
      # requirepass 를 걸면 인증 없는 PING 은 NOAUTH 로 실패한다 — 헬스체크도 인증해야 한다.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
    deploy:
      resources:
        limits:
          # 실측 사용량 42.8 MiB. 1.5 GiB는 12 GiB 박스에서 과배정이고,
          # maxmemory(512mb)보다 컨테이너 상한이 커야 Redis가 자기 정책으로
          # 축출하기 전에 OOM 킬을 당하지 않는다.
          cpus: "0.75"
          memory: 768M
        reservations:
          memory: 128M

  api:
    environment:
      # Redis 비밀번호가 붙은 URL. base의 REDIS_URL 기본값을 이 값이 덮는다.
      # (같은 변수를 워커 8개도 쓰므로 한 곳만 고치면 된다.)
      REDIS_URL: "${REDIS_URL_CONTAINER:?REDIS_URL_CONTAINER 를 설정하세요 — 예 redis://:PASSWORD@redis:6379/0}"
      # nginx 뒤에 있으므로 XFF 를 믿는다. **nginx가 유일한 입구일 때만 참이다** —
      # base가 api를 loopback에만 게시하는 이유가 이것이다.
      TRUST_PROXY_HEADERS: "true"
      # TLS 종단이 있으므로 인증 쿠키에 Secure 를 붙인다.
      AUTH_COOKIE_SECURE: "true"
    deploy:
      resources:
        limits:
          # 2.0 → 1.5. 2 OCPU 박스에서 api 한 컨테이너가 전부를 가져갈 수 있으면
          # OCR·gzip 부하가 nginx·fe까지 함께 굶긴다. 상한을 남겨 두는 쪽이 안전하다.
          # (cpu_shares 는 base에 있다 — 경합 시 배분율은 여전히 api가 가장 높다.)
          cpus: "1.5"
          memory: 1G
        reservations:
          memory: 128M

  nginx:
    ports:
      # :80 · :443 은 base 가 NGINX_HTTP_PORT / NGINX_HTTPS_PORT 로 연다.
      # 여기서 ports 를 또 적으면 compose 병합 시 중복 게시가 난다.
    volumes:
      # certbot(--webroot)이 발급/갱신한 인증서. 호스트에서 갱신하고 nginx는 읽기만 한다.
      # 갱신 후 `docker kill -s HUP quant-port-nginx` 로 무중단 리로드.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      # 도메인·인증서 경로·HSTS. VM 마다 다르므로 리포가 아니라 호스트에서 온다.
      # 모양은 deploy/nginx/tls_site.conf.example.
      # NGINX_CONF=nginx.conf(평문)로 올릴 때는 include 되지 않으므로 없어도 된다 —
      # 다만 파일이 없으면 마운트가 디렉터리를 만들므로, 미리 만들어 두는 편이 낫다.
      - ${NGINX_TLS_SITE:-/etc/quant-port/nginx-tls-site.conf}:/etc/nginx/tls_site.conf:ro
